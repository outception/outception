<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Outception maintenance</title>
<style>
  :root {
    --ink: #3b342c;
    --muted: #7d7362;
    --paper: #fbfaf6;
    --page: radial-gradient(circle at 32% 20%, #faf9f4 0%, #f0eee4 50%, #cfc9b8 100%);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ink: #ffb3ba;
      --muted: #c98890;
      --paper: #220609;
      --page: radial-gradient(circle at 32% 20%, #5c0a12 0%, #1a0407 56%, #0a0102 100%);
    }
  }
  * { margin: 0; box-sizing: border-box; }
  body {
    min-height: 100svh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--page);
    color: var(--ink);
    font-family: 'Geist', 'Inter', sans-serif;
    padding: 24px;
  }
  main {
    width: 100%;
    max-width: 440px;
    background: var(--paper);
    border-radius: 16px;
    padding: 40px 36px;
    box-shadow: 0 0 30px rgba(0 0 0 / 0.05), 0 0 10px rgba(0 0 0 / 0.06);
  }
  /* The brand gem, static - the same crisp mark the wall header shows. */
  }
  .gem-static {
    display: block;
    width: 56px;
    height: 56px;
    margin-bottom: 28px;
  }
  h1 {
    font-family: 'Hanken Grotesk', Georgia, serif;
    font-weight: 640;
    font-size: 1.55rem;
    letter-spacing: -0.015em;
    margin-bottom: 10px;
  }
  p.lede { color: var(--muted); font-size: 0.95rem; line-height: 1.5; }
  .try {
    margin: 22px 0 26px;
    color: var(--muted);
    font-size: 0.9rem;
    line-height: 1.5;
  }
  .try b {
    display: block;
    color: var(--ink);
    font-weight: 560;
    margin-bottom: 6px;
  }
  button {
    font: inherit;
    font-weight: 560;
    font-size: 0.9rem;
    color: var(--ink);
    background: none;
    border: 1px solid color-mix(in srgb, var(--ink) 22%, transparent);
    border-radius: 9999px;
    padding: 8px 18px;
    cursor: pointer;
  }
  button:active { transform: scale(0.97); }
  .code {
    display: block;
    margin-top: 30px;
    font-family: 'GeistMono', monospace;
    font-size: 0.68rem;
    letter-spacing: 0.08em;
    color: var(--muted);
  }
</style>
</head>
<body>
<main>
  <svg class="gem-static" viewBox="288 160 448 448" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <defs>
      <radialGradient id="dome" cx="0.5" cy="0.28" r="0.5">
        <stop offset="0" stop-color="#ffadb4" />
        <stop offset="0.32" stop-color="#e81c2e" />
        <stop offset="0.75" stop-color="#c11322" />
        <stop offset="1" stop-color="#98101c" />
      </radialGradient>
      <linearGradient id="tail" x1="0" y1="384" x2="0" y2="578" gradientUnits="userSpaceOnUse">
        <stop offset="0" stop-color="#700c15" />
        <stop offset="0.30" stop-color="#98101c" />
        <stop offset="1" stop-color="#ff8290" />
      </linearGradient>
      <clipPath id="star">
        <path transform="translate(0,768) scale(0.1,-0.1)" d="M5059 5751 c-93 -30 -117 -61 -228 -285 -158 -319 -317 -543 -555 -782 -255 -255 -523 -440 -866 -597 -113 -52 -151 -81 -181 -139 -44 -87 -33 -186 29 -258 28 -33 68 -57 196 -119 336 -161 579 -332 826 -580 236 -237 396 -462 552 -778 80 -163 108 -210 140 -237 83 -71 213 -71 296 0 32 27 60 74 140 237 156 314 317 542 552 778 246 247 485 416 816 575 137 66 178 91 206 124 78 91 74 223 -10 313 -14 15 -116 72 -226 126 -319 158 -544 317 -782 555 -236 236 -397 463 -552 775 -105 212 -125 242 -185 272 -44 23 -128 33 -168 20z" />
      </clipPath>
    </defs>
    <g clip-path="url(#star)">
      <rect x="288" y="160" width="448" height="448" fill="url(#dome)" />
      <path d="M296 374 Q512 450 728 374 L728 624 L296 624 Z" fill="url(#tail)" />
      <path d="M322 384 Q512 436 702 384" stroke="#4a080e" stroke-width="4" fill="none" opacity="0.45" />
      <path d="M330 380 Q512 426 694 380" stroke="#ffd7da" stroke-width="3" fill="none" opacity="0.55" />
    </g>
  </svg>
  <h1>Back soon</h1>
  <p class="lede">Maintenance in progress. The news wall is on its way back. Nothing to do on your side.</p>
  <div class="try">
    <b>This page reloads itself</b>
    Headlines return the moment the wall is back up.
  </div>
  <button onclick="location.reload()">Try now</button>
  <span class="code">MAINTENANCE IN PROGRESS</span>
</main>
<script>
  setTimeout(function () { location.reload() }, 30000)
</script>
</body>
</html>
