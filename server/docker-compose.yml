services:
  redis:
    image: redis:alpine
    ports:
      - "${OUTCEPTION_REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 10s
      retries: 10

  db:
    image: postgres:15.1-bullseye
    command: ["postgres", "-c", "max_locks_per_transaction=256"]
    environment:
      - POSTGRES_USER=${OUTCEPTION_POSTGRES_USER}
      - POSTGRES_PASSWORD=${OUTCEPTION_POSTGRES_PWD}
      - POSTGRES_DB=${OUTCEPTION_POSTGRES_DATABASE}
      - POSTGRES_PORT=${OUTCEPTION_POSTGRES_PORT:-5432}
      - OUTCEPTION_READ_USER=${OUTCEPTION_POSTGRES_READ_USER:-outception_read}
      - OUTCEPTION_READ_PASSWORD=${OUTCEPTION_POSTGRES_READ_PWD}
    volumes:
      - postgres_data:/var/lib/postgresql/data/
      - ./init-readonly-user.sql:/docker-entrypoint-initdb.d/init-readonly-user.sql
    ports:
      - "${OUTCEPTION_POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test:
        [
          "CMD",
          "pg_isready",
          "-q",
          "-d",
          "${OUTCEPTION_POSTGRES_DATABASE}",
          "-U",
          "${OUTCEPTION_POSTGRES_USER}",
        ]
      timeout: 40s
      interval: 2s
      retries: 20

volumes:
  postgres_data:
