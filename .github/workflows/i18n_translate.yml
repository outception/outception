name: Generate Translations

on:
  # Run on PRs and on direct pushes to main (this repo deploys by pushing
  # straight to main, so new en.ts strings must be translated on push too). The
  # bot commits only the non-en locale files, which don't match these paths, so
  # it never re-triggers itself. workflow_dispatch lets you backfill on demand
  # (e.g. after locales drift) without touching en.ts.
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "clients/packages/i18n/src/locales/en.ts"
      - "clients/packages/i18n/src/config.ts"
  pull_request:
    paths:
      - "clients/packages/i18n/src/locales/en.ts"
      - "clients/packages/i18n/src/config.ts"

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  translate:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ${{ github.workspace }}/clients

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          # PRs check out the PR head branch; direct pushes check out the pushed
          # branch (main).
          ref: ${{ github.head_ref || github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          package_json_file: clients/package.json

      - name: Setup Node.js environment
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: clients/.node-version
          cache: "pnpm"
          cache-dependency-path: "clients/pnpm-lock.yaml"

      - name: Install dependencies
        run: pnpm install --ignore-scripts

      - name: Generate translations
        # Claude when the key is set; keyless Google Translate as fallback.
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: pnpm --filter @outception-com/i18n translate

      # translate removes orphans as part of a full run, but only for locales it
      # touches; this catches any left behind (a key deleted from en.ts leaves
      # its translations in all 46 files, bundled into both apps and invisible
      # at runtime because deepMerge only reads keys en.ts still defines).
      - name: Prune orphaned keys
        run: pnpm --filter @outception-com/i18n prune:orphans

      # Nothing gated on this before, so drift accumulated silently. Runs AFTER
      # translate + prune, when both missing and extra keys should be zero.
      - name: Validate translations
        run: pnpm --filter @outception-com/i18n validate

      - name: Commit translations
        # A full run takes ~an hour, and main moves (and is force-pushed) while
        # it does, so a plain push loses the whole hour to "fetch first". Carry
        # just the generated locale files onto whatever main is now, and retry
        # if it moves again mid-push.
        #
        # Runs at the repo root, not in clients/: `git apply` ignores patched
        # paths outside the current directory, and the patch's paths are
        # repo-root relative.
        working-directory: ${{ github.workspace }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add clients/packages/i18n/
          if git diff --staged --quiet; then
            echo "No translation changes."
            exit 0
          fi
          branch="${{ github.head_ref || github.ref_name }}"
          patch="$(mktemp)"
          git diff --staged --binary > "$patch"
          for attempt in 1 2 3 4 5; do
            git reset --hard >/dev/null
            git fetch origin "$branch"
            git checkout -B "$branch" "origin/$branch"
            git apply --3way "$patch" || {
              echo "Generated locales no longer apply to $branch; regenerate."
              exit 1
            }
            git add clients/packages/i18n/
            if git diff --staged --quiet; then
              echo "Already up to date on $branch."
              exit 0
            fi
            git commit -m "chore(i18n): update translations"
            if git push origin "$branch"; then
              exit 0
            fi
            echo "Push rejected (attempt $attempt); $branch moved. Retrying."
            sleep 10
          done
          echo "Could not land translations after 5 attempts."
          exit 1
