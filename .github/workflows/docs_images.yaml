name: Compress docs images

on:
  pull_request:
    paths:
      - "clients/apps/web/content/**.png"
      - "clients/apps/web/content/**.jpg"
      - "clients/apps/web/content/**.jpeg"
      - "clients/apps/web/content/**.webp"

permissions: {}

jobs:
  compress:
    if: github.event.pull_request.head.repo.full_name == github.repository
    name: calibreapp/image-actions
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Compress Images
        uses: calibreapp/image-actions@9d037c06280028c110ff61c433ad4dc7d33c3c43 # 1.5.0
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
