name: Server

on:
  push:
    branches: ["main"]
  pull_request:
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  OUTCEPTION_ENV: testing

permissions:
  contents: read

jobs:
  changes:
    name: "Detect changes"
    runs-on: ubuntu-latest
    outputs:
      server: ${{ steps.filter.outputs.server }}
      migrations: ${{ steps.filter.outputs.migrations }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            # Beyond the server itself: the boundary tests read every
            # workflow, the env and naming checks read deploy/ and docs/,
            # so a change there alone must still run them.
            server:
              - 'server/**'
              - 'docs/**'
              - 'deploy/**'
              - '.github/workflows/**'
              - '.github/actions/**'
            migrations:
              - 'server/migrations/versions/**'
              - 'server/scripts/check_migrations.py'

  linters:
    name: "Server: Linters"
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    env:
      OUTCEPTION_EMAIL_RENDERER_BINARY_PATH: /tmp/email-renderer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: server/uv.lock
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: server/.python-version
      - name: Install
        working-directory: ./server
        run: uv sync --dev --frozen
      - name: Mock the email renderer binary
        run: touch /tmp/email-renderer
      - name: Lint
        working-directory: ./server
        run: uv run task lint_check
      - name: Types
        working-directory: ./server
        run: uv run task lint_types
      - name: Env contract
        working-directory: ./server
        run: uv run python -m scripts.check_env_vars
      - name: Env examples load as written
        working-directory: ./server
        run: uv run python -m scripts.env_examples --check
      - name: Naming
        working-directory: ./server
        run: uv run python -m scripts.linters.names --strict
      - name: Evals gate (the scrubber)
        working-directory: ./server
        run: uv run python -m evals.run --suite scrub
      - name: Public API reference
        working-directory: ./server
        run: uv run python -m scripts.api_docs --check

  migrations:
    name: "Server: Migrations"
    needs: changes
    if: needs.changes.outputs.migrations == 'true' && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      OUTCEPTION_EMAIL_RENDERER_BINARY_PATH: /tmp/email-renderer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: server/uv.lock
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: server/.python-version
      - name: Install
        working-directory: ./server
        run: uv sync --frozen --no-dev
      - name: Mock the email renderer binary
        run: touch /tmp/email-renderer
      - name: One head, later filenames
        working-directory: ./server
        run: uv run python -m scripts.check_migrations --base "${{ github.event.pull_request.base.sha }}"

  test:
    name: "Server: Tests"
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OUTCEPTION_EMAIL_RENDERER_BINARY_PATH: ${{ github.workspace }}/server/emails/bin/react-email-pkg
    services:
      postgres:
        image: postgres:15.1-bullseye
        env:
          POSTGRES_USER: outception
          POSTGRES_PASSWORD: outception
          POSTGRES_DB: outception_rebuild_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: server/uv.lock
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: server/.python-version
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: server/emails/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: server/emails/pnpm-lock.yaml
      - name: Cache the email renderer
        id: emails
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: server/emails/bin
          key: emails-${{ runner.os }}-${{ hashFiles('server/emails/**', '!server/emails/node_modules/**', '!server/emails/bin/**') }}
      - name: Build the email renderer
        if: steps.emails.outputs.cache-hit != 'true'
        working-directory: server/emails
        run: pnpm install --frozen-lockfile && pnpm build
      - name: Install
        working-directory: ./server
        run: uv sync --dev --frozen
      - name: Migrate
        working-directory: ./server
        run: uv run task db_migrate
      - name: Migration check
        working-directory: ./server
        run: uv run alembic check
      - name: Test
        working-directory: ./server
        run: uv run pytest -n auto --no-cov -p no:sugar
