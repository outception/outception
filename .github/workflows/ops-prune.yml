# One-off operational task: reclaim disk on the host by pruning unused
# Docker images and build cache. Volumes (DB / buckets / models) are untouched.
# Run manually from the Actions tab or with:
#   gh workflow run ops-prune.yml
# Uses the same SSH secrets as the deploy workflow.
name: Ops (prune docker cache)

on:
  workflow_dispatch:

permissions: {}

jobs:
  prune:
    runs-on: ubuntu-latest
    environment: production
    steps:
      # Fail closed: without a pinned fingerprint the SSH client would trust
      # whoever answers, and ship every secret below to it.
      - name: Host key is pinned
        env:
          FINGERPRINT: ${{ vars.SSH_HOST_FINGERPRINT }}
        run: |
          [ -n "$FINGERPRINT" ] || { echo "::error::SSH_HOST_FINGERPRINT is unset"; exit 1; }
      - name: Prune docker images + build cache over SSH
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.SSH_HOST }}
          # The host's key fingerprint (repository variable; the ECDSA key, which the
          # client negotiates first). The step above refuses to run without it.
          fingerprint: ${{ vars.SSH_HOST_FINGERPRINT }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -euo pipefail
            echo "=== disk before ==="
            df -h / | tail -1
            docker image prune -af
            docker builder prune -f
            echo "=== disk after ==="
            df -h / | tail -1
