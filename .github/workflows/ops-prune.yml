# One-off operational task: reclaim disk on the Hetzner host by pruning unused
# Docker images and build cache. Volumes (DB / buckets / models) are untouched.
# Run manually from the Actions tab or with:
#   gh workflow run ops-prune.yml
# Uses the same SSH secrets as the deploy workflow.
name: Ops (prune docker cache)

on:
  workflow_dispatch:

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - name: Prune docker images + build cache over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -euo pipefail
            echo "=== disk before ==="
            df -h / | tail -1
            docker image prune -af
            docker builder prune -f
            echo "=== disk after ==="
            df -h / | tail -1
