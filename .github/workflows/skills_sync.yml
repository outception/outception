name: skills sync
on:
  pull_request:
    paths:
      - skills/**
      - clients/packages/mcp/skills/**
      - clients/scripts/sync-skills.ts
  push:
    branches: [main]
    paths:
      - skills/**
      - clients/packages/mcp/skills/**

permissions:
  contents: read

jobs:
  check:
    name: The bundled skills match skills/
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./clients
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          package_json_file: clients/package.json
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: clients/.nvmrc
      - name: Check
        run: npx --yes tsx scripts/sync-skills.ts --check
