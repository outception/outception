name: app preview
on:
  pull_request:
    paths:
      - clients/apps/app/**
      - clients/packages/news-core/**
      - clients/packages/client/**
      - clients/packages/i18n/**

permissions: {}

jobs:
  update:
    name: Over-the-air preview
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ github.workspace }}/clients
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check for the publishing token
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "EXPO_TOKEN is not set in this repository's secrets."
            exit 1
          fi

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: clients/package.json

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: clients/.nvmrc
          cache: "pnpm"
          cache-dependency-path: "clients/pnpm-lock.yaml"

      - name: Setup the build service
        uses: expo/expo-github-action@9da89d3617bb88139671bad31b09c65714c2ee06 # v9
        with:
          working-directory: ${{ github.workspace }}/clients/apps/app
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: pnpm install

      - name: Build the packages
        run: pnpm exec turbo run build --filter='./packages/*'

      - name: Create preview
        uses: expo/expo-github-action/preview@9da89d3617bb88139671bad31b09c65714c2ee06 # v9
        with:
          working-directory: ${{ github.workspace }}/clients/apps/app
          command: eas update --auto --channel preview
