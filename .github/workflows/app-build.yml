name: app build
on:
  workflow_dispatch:
    inputs:
      profile:
        description: "Build profile from eas.json"
        required: true
        default: development
        type: choice
        options:
          - development
          - simulator
          - production
      platform:
        description: "Platform"
        required: true
        default: android
        type: choice
        options:
          - android
          - ios
          - all

permissions: {}

# Builds a binary on the build service and leaves it there for the rig.
# Store submission is a separate, hand-run step; nothing here submits.
jobs:
  build:
    name: Binary (${{ inputs.profile }}, ${{ inputs.platform }})
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: ${{ github.workspace }}/clients
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check for the publishing token
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "EXPO_TOKEN is not set in this repository's secrets."
            exit 1
          fi

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          package_json_file: clients/package.json

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: clients/.nvmrc
          cache: "pnpm"
          cache-dependency-path: "clients/pnpm-lock.yaml"

      - name: Setup the build service
        uses: expo/expo-github-action@eab7a230208c952974db8c3245cfd78402c7b385 # v9
        with:
          working-directory: ${{ github.workspace }}/clients/apps/app
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: pnpm install

      - name: Build the packages
        run: pnpm exec turbo run build --filter='./packages/*'

      - name: Build
        working-directory: ${{ github.workspace }}/clients/apps/app
        run: eas build --non-interactive --no-wait --platform ${{ inputs.platform }} --profile ${{ inputs.profile }}
