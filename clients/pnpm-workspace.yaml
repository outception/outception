packages:
  - apps/*
  - packages/*

allowBuilds:
  # Hooks are installed on purpose: `pnpm exec lefthook install`.
  lefthook: false
  dtrace-provider: false
  '@parcel/watcher': true
  '@sentry/cli': true
  '@tailwindcss/oxide': true
  core-js-pure: true
  esbuild: true
  sharp: true
  unrs-resolver: true
  openapi-typescript: true
  core-js: false
  msw: false
  protobufjs: false

minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  # The agent tools SDK ships often; its current release is what the server needs.
  - '@modelcontextprotocol/sdk@1.32.1'
  - 'expo@57.0.25'
  - '@expo/ui@57.0.20'
  - 'expo-auth-session@57.0.13'
  - 'expo-insights@57.0.20'
  - 'expo-linking@57.0.11'
  - 'expo-router@57.0.23'
  - 'expo-glass-effect@57.0.4'
  - 'babel-preset-expo@57.0.13'
  - 'expo-modules-core@57.0.19'
  - '@expo/cli@57.0.27'
  - 'expo-modules-jsi@57.1.1'
  - '@expo/router-server@57.0.11'

catalog:
  'recharts': '^3.10.1'
  '@tanstack/react-table': '^9.3.1'
  '@stripe/stripe-js': '^10.1.0'
  '@radix-ui/react-checkbox': '^1.4.1'
  '@radix-ui/react-dialog': '^1.1.23'
  '@radix-ui/react-dropdown-menu': '^2.2.1'
  '@radix-ui/react-select': '^2.4.1'
  '@radix-ui/react-slot': '^1.3.3'
  '@radix-ui/react-switch': '^1.4.1'
  '@radix-ui/react-tabs': '^1.2.1'
  '@radix-ui/react-toast': '^1.3.1'
  '@radix-ui/react-tooltip': '^1.4.1'
  '@stylexjs/babel-plugin': '^0.19.1'
  '@stylexjs/postcss-plugin': '^0.19.1'
  '@stylexjs/stylex': '^0.19.1'
  '@tailwindcss/forms': '^0.5.11'
  '@tailwindcss/postcss': '^4.3.3'
  '@testing-library/react': '^16.3.3'
  '@types/node': '^24.19.2'
  '@types/react': '19.3.0'
  '@types/react-dom': '19.3.0'
  '@typescript/native': 'npm:typescript@7.0.2'
  '@vitejs/plugin-react': '^6.1.2'
  '@vitest/coverage-v8': '^5.0.5'
  '@vitest/ui': '^5.0.5'
  'class-variance-authority': '^0.7.1'
  'date-fns': '^4.4.0'
  'event-source-plus': '^0.1.15'
  'eventemitter3': '^5.0.4'
  'jsdom': '^30.1.3'
  'lucide-react': '^1.59.0'
  'markdown-to-jsx': '^9.10.3'
  'motion': '^14.3.0'
  'next-themes': '^0.4.6'
  'react-focus-lock': '^2.13.7'
  'react-hook-form': '~7.90.0'
  'react-timeago': '^8.3.0'
  'tailwind-merge': '^3.7.0'
  'tailwindcss': '^4.3.3'
  'tsup': '^9.0.0'
  'typescript': 'npm:@typescript/typescript6@6.0.2'
  'vitest': '^5.0.5'
  'zod': '^4.6.7'

overrides:
  '@types/react-dom': 19.3.0
  '@types/react': 19.3.0
  '@xmldom/xmldom@<0.8.12': '>=0.8.12'
  '@xmldom/xmldom@<0.8.13': '>=0.8.13'
  '@xmldom/xmldom@>=0.7.0 <=0.8.13': '>=0.8.14'
  '@xmldom/xmldom@>=0.7.0 <=0.8.14': '>=0.8.15'
  'decode-uri-component@<=0.4.2': '>=0.5.0'
  'esbuild@>=0.27.3 <0.28.1': '>=0.28.1'
  nuxi: 3.28.0
  'uuid@<11.1.1': '>=11.1.1'
  'webpack@>=5.49.0 <=5.104.0': '>=5.104.1'
  'webpack@>=5.49.0 <5.104.0': '>=5.104.0'

# Workspace packages never carry their own React: the apps provide it, and
# the app bundles exactly one copy.
autoInstallPeers: false
