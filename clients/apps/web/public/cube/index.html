<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width,height=device-height,user-scalable=no,initial-scale=1.0,maximum-scale=1.0,minimum-scale=1.0"
    />
    <meta name="robots" content="noindex" />
    <title>Cube</title>
    <link rel="stylesheet" type="text/css" href="styles.css" />
    <style>
      /* House type: the wall's display face replaces the bundled game font
       (same file the parent page uses, so it's warm in the browser cache).
       The heavy weight keeps the title/timer poster look. */
      @font-face {
        font-family: 'Hanken Grotesk';
        font-weight: 100 900;
        font-style: normal;
        font-display: swap;
        src: url('/fonts/HankenGrotesk-Variable.woff2') format('woff2');
      }
      body {
        font-family: 'Hanken Grotesk', sans-serif;
      }
      .text {
        font-weight: 800;
      }
    </style>
  </head>
  <body>
    <div class="ui">
      <div class="ui__background"></div>

      <div class="ui__game"></div>

      <div class="ui__texts">
        <h1 class="text text--title">
          <span>THE</span>
          <span>CUBE</span>
        </h1>
        <div class="text text--note">Double tap to start</div>
        <div class="text text--timer">0:00</div>
        <div class="text text--complete">
          <span>Complete!</span>
        </div>
        <div class="text text--best-time">
          <icon trophy></icon>
          <span>Best Time!</span>
        </div>
      </div>

      <div class="ui__prefs">
        <range name="size" title="Cube Size" list="2,3,4,5"></range>
        <range
          name="flip"
          title="Flip Type"
          list="Swift&nbsp;,Smooth,Bounce"
        ></range>
        <range name="scramble" title="Scramble Length" list="20,25,30"></range>
        <range
          name="fov"
          title="Camera Angle"
          list="Ortographic,Perspective"
        ></range>
        <range
          name="theme"
          title="Color Scheme"
          list="Cube,Erno,Dust,Camo,Rain"
        ></range>
      </div>

      <div class="ui__theme">
        <range name="hue" title="Hue" color></range>
        <range name="saturation" title="Saturation" color></range>
        <range name="lightness" title="Lightness" color></range>
      </div>

      <div class="ui__stats">
        <div class="stats" name="cube-size"><i>Cube:</i><b>3x3x3</b></div>
        <div class="stats" name="total-solves">
          <i>Total solves:</i><b>-</b>
        </div>
        <div class="stats" name="best-time"><i>Best time:</i><b>-</b></div>
        <div class="stats" name="worst-time"><i>Worst time:</i><b>-</b></div>
        <div class="stats" name="average-5"><i>Average of 5:</i><b>-</b></div>
        <div class="stats" name="average-12"><i>Average of 12:</i><b>-</b></div>
        <div class="stats" name="average-25"><i>Average of 25:</i><b>-</b></div>
      </div>

      <div class="ui__buttons">
        <button class="btn btn--bl btn--stats">
          <icon trophy></icon>
        </button>
        <button class="btn btn--br btn--prefs">
          <icon settings></icon>
        </button>
        <button class="btn btn--bl btn--back">
          <icon back></icon>
        </button>
        <button class="btn btn--br btn--theme">
          <icon theme></icon>
        </button>
        <button class="btn btn--br btn--reset">
          <icon reset></icon>
        </button>
      </div>
    </div>

    <script src="three.js"></script>
    <script src="cube.js"></script>
    <script>
      // Menu taps match the other game cards: with a solve in progress a single
      // tap continues and a double tap restarts (wipes the saved solve and
      // reloads; a session flag re-enters automatically). Fresh cube keeps
      // double-tap-to-start. Trusted menu taps are swallowed before the engine's
      // own double-click detection sees them; the shim drives window.game itself.
      ;(function () {
        var note = document.querySelector('.text--note')
        // The engine exposes itself as window.game — state 0 is the menu. The
        // title's own opacity never changes (its letters animate one by one),
        // so state is the only reliable menu signal.
        var eng = function () {
          return window.game
        }
        var menuVisible = function () {
          var g = eng()
          return (
            !!g &&
            g.state === 0 &&
            !(g.transition && 0 < g.transition.activeTransitions)
          )
        }
        var hasSave = function () {
          var g = eng()
          if (g && g.saved) return true
          try {
            return (
              localStorage.getItem('theCube_playing') === 'true' ||
              !!localStorage.getItem('theCube_savedState')
            )
          } catch (e) {
            return false
          }
        }
        var syncNote = function () {
          if (!menuVisible()) return
          var mode = hasSave() ? 'save' : 'fresh'
          if (note.dataset.mode === mode) return
          note.dataset.mode = mode
          note.style.lineHeight = '1.9'
          note.innerHTML =
            mode === 'save'
              ? 'Tap to continue<br>double tap to restart'
              : 'Double tap to start'
        }
        setInterval(syncNote, 500)
        syncNote()
        var enter = function () {
          var g = eng()
          if (g && g.state === 0) g.game(true)
        }
        var restart = function () {
          try {
            localStorage.removeItem('theCube_savedState')
            localStorage.removeItem('theCube_playing')
            localStorage.removeItem('theCube_time')
          } catch (e) {}
          // Restart in place: solved cube, zeroed clock, saved=false forces a
          // fresh scramble — straight into the new game, no reload limbo.
          try {
            var g = eng()
            g.cube.reset()
            g.timer.reset()
            g.saved = false
            g.game(true)
          } catch (e) {
            try {
              sessionStorage.setItem('cubeFresh', '1')
            } catch (e2) {}
            location.reload()
          }
        }
        var last = 0,
          pending = null
        var handleTap = function () {
          var now = Date.now()
          if (pending) {
            clearTimeout(pending)
            pending = null
          }
          if (now - last < 400) {
            last = 0
            if (hasSave()) restart()
            else enter()
            return
          }
          last = now
          pending = setTimeout(function () {
            pending = null
            if (menuVisible() && hasSave()) enter()
          }, 410)
        }
        ;[
          'pointerdown',
          'pointerup',
          'mousedown',
          'mouseup',
          'touchstart',
          'touchend',
          'click',
          'dblclick',
        ].forEach(function (t) {
          window.addEventListener(
            t,
            function (e) {
              if (!e.isTrusted || !menuVisible()) return
              if (
                !(e.target && e.target.closest && e.target.closest('.ui__game'))
              )
                return
              if (t === 'pointerup') handleTap()
              e.stopImmediatePropagation()
              if (e.cancelable) e.preventDefault()
            },
            true,
          )
        })
        if (sessionStorage.getItem('cubeFresh') === '1') {
          sessionStorage.removeItem('cubeFresh')
          var tries = 0
          var kick = setInterval(function () {
            tries++
            if (menuVisible()) {
              clearInterval(kick)
              enter()
            } else if (tries > 20) clearInterval(kick)
          }, 300)
        }
      })()
      // Double tap pauses the solve (same gesture as the crossword and sudoku
      // cards): two quick stationary taps while the timer is up press Back for
      // you. Drags (layer turns) and camera swipes never qualify — a tap must
      // stay put and end fast.
      // Inside the wall card the clock lives in the card header: mirror the
      // engine's timer text up via postMessage and hide the in-scene copy.
      // ?embed=1 marks a native WebView host (which can't nest an iframe) and
      // gets the same treatment, mirrored over the ReactNativeWebView bridge —
      // the flag only counts alongside the bridge object, so a plain browser
      // visiting ?embed=1 keeps the standalone behavior.
      ;(function () {
        var EMBED_APP =
          new URLSearchParams(location.search).has('embed') &&
          !!window.ReactNativeWebView
        if (window.self === window.top && !EMBED_APP) return
        var t = document.querySelector('.text--timer')
        var post = function () {
          var payload = {
            outceptionGame: 'cube',
            timer: (t.textContent || '0:00').trim(),
          }
          try {
            parent.postMessage(payload, '*')
          } catch (e) {}
          try {
            if (window.ReactNativeWebView)
              window.ReactNativeWebView.postMessage(JSON.stringify(payload))
          } catch (e) {}
        }
        new MutationObserver(post).observe(t, {
          childList: true,
          characterData: true,
          subtree: true,
        })
        post()
        var st = document.createElement('style')
        st.textContent = '.text--timer { visibility: hidden !important; }'
        document.head.appendChild(st)
      })()
      ;(function () {
        var game = document.querySelector('.ui__game')
        var back = document.querySelector('.btn--back')
        var timer = document.querySelector('.text--timer')
        var lastTap = 0,
          x = 0,
          y = 0,
          t0 = 0
        game.addEventListener(
          'pointerdown',
          function (e) {
            x = e.clientX
            y = e.clientY
            t0 = Date.now()
          },
          true,
        )
        game.addEventListener(
          'pointerup',
          function (e) {
            var moved = Math.hypot(e.clientX - x, e.clientY - y)
            if (moved > 12 || Date.now() - t0 > 300) {
              lastTap = 0
              return
            }
            var now = Date.now()
            var playing =
              parseFloat(getComputedStyle(timer).opacity) > 0.5 &&
              getComputedStyle(back).visibility !== 'hidden'
            if (playing && now - lastTap < 400) {
              lastTap = 0
              back.click()
              return
            }
            lastTap = now
          },
          true,
        )
      })()
    </script>
  </body>
</html>
